name: weather_app
description: A weather forecast application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  get_it: ^7.7.0

  mobx: ^2.3.0+1
  flutter_mobx: ^2.2.0+1

  dio: ^5.4.0

  intl: ^0.20.2
  json_annotation: ^4.9.0

  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  geolocator: ^14.0.2

  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.8
  mobx_codegen: ^2.6.0+1
  json_serializable: ^6.8.0
  analyzer: ^6.4.0

  flutter_lints: ^3.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

flutter:
  generate: true

  uses-material-design: true

  assets:
    - assets/images/weather_state_images/
    - assets/images/map_images/
    - assets/images/app_images/
    - .env
